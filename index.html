<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Planning SQUADIR - PRO (Capture F12)</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,700;1,700&family=Rajdhani:wght@500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #111; font-family: 'Rajdhani', sans-serif; display: flex; height: 100vh; overflow: hidden; color: #fff; }

        /* ─── SIDEBAR (GÉNÉRATEUR) ─── */
        .sidebar { width: 450px; background: #0a0514; border-right: 1px solid rgba(168, 85, 247, 0.3); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 100; }
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #030107; }
        .sidebar::-webkit-scrollbar-thumb { background: #9d00ff; border-radius: 4px; }
        .sidebar h2 { font-family: 'Oswald', sans-serif; color: #22d3ee; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid rgba(34, 211, 238, 0.3); padding-bottom: 5px; margin-bottom: 10px; }

        details { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 5px; }
        summary { font-family: 'Oswald', sans-serif; font-size: 18px; color: #d8b4fe; font-weight: 700; text-transform: uppercase; padding: 15px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 14px; color: #a855f7; }
        details[open] summary::after { content: '▲'; }
        .details-content { padding: 0 15px 15px 15px; display: flex; flex-direction: column; gap: 12px; }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; color: #9ca3af; font-size: 12px; text-transform: uppercase; }
        .form-group input, .form-group select { padding: 8px; background: #030107; border: 1px solid rgba(168, 85, 247, 0.4); color: #fff; border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #22d3ee; box-shadow: 0 0 10px rgba(34, 211, 238, 0.2); }
        .split-divider { width: 100%; height: 1px; background: rgba(34, 211, 238, 0.3); margin: 10px 0; }

        .upload-btn { background: rgba(168, 85, 247, 0.15); border: 1px dashed #a855f7; color: #fff; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .upload-btn:hover { background: rgba(168, 85, 247, 0.3); border-color: #22d3ee; }
        .upload-btn input[type="file"] { display: none; }

        /* Nouveau design pour le bouton de préparation F12 */
        .f12-btn { background: linear-gradient(to right, #e11d48, #be123c); color: #fff; border: none; padding: 15px; font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s; margin-top: 20px; flex-shrink: 0; }
        .f12-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(225, 29, 72, 0.4); }
        
        .f12-help { font-size: 13px; color: #9ca3af; text-align: center; margin-top: 5px; font-weight: 600; }

        /* ─── PREVIEW & POSTER ─── */
        .preview-area { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; overflow: auto; padding: 20px; }
        
        .poster { 
            width: 1920px; height: 1080px; min-width: 1920px; min-height: 1080px; 
            background-color: #05020a; position: relative; overflow: hidden; 
            padding: 45px 60px 85px; display: flex; flex-direction: column; 
            transform: scale(0.65); transform-origin: center center; transition: transform 0.3s ease;
            border: 3px solid #9d00ff; box-shadow: inset 0 0 150px rgba(157, 0, 255, 0.2), 0 0 40px rgba(157, 0, 255, 0.4);
        }

        /* FOND & EFFETS */
        .bg-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .bg-layer::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(157, 0, 255, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(34, 211, 238, 0.15) 0%, transparent 40%), #030107; }
        .beam-1, .beam-2 { position: absolute; width: 200%; height: 180px; transform-origin: center; }
        .beam-1 { top: 15%; left: -50%; transform: rotate(-35deg); background: linear-gradient(to right, transparent 0%, rgba(168, 85, 247, 0.08) 50%, transparent 100%); }
        .beam-2 { top: 60%; left: -50%; transform: rotate(-35deg); background: linear-gradient(to right, transparent 0%, rgba(34, 211, 238, 0.05) 50%, transparent 100%); }
        .watermark { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); font-family: 'Oswald', sans-serif; font-weight: 700; font-style: italic; font-size: 380px; color: rgba(255, 255, 255, 0.015); white-space: nowrap; letter-spacing: -5px; z-index: 1; }
        .dot-matrix { position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.5px, transparent 1.5px); background-size: 32px 32px; z-index: 2; mask-image: radial-gradient(circle at center, black 40%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%); }
        .poster::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%); background-size: 100% 4px; pointer-events: none; z-index: 3; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: flex-end; position: relative; z-index: 10; padding-bottom: 25px; margin-bottom: 35px; }
        .title-group { display: flex; flex-direction: column; }
        .title-planning { font-family: 'Oswald', sans-serif; font-style: italic; font-size: 88px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; line-height: 0.85; text-shadow: 0 0 40px rgba(168, 85, 247, 0.9); }
        .title-name { font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 600; color: #22d3ee; text-shadow: 0 0 20px rgba(168, 85, 247, 0.6); letter-spacing: 12px; margin-top: 10px; text-transform: uppercase; }
        
        .header-badge { 
            background-color: #1a0b35; border: 2px solid rgba(168, 85, 247, 0.8); border-left: 8px solid #22d3ee; 
            border-radius: 6px; padding: 12px 35px; font-family: 'Oswald', sans-serif; font-style: italic; 
            font-size: 32px; color: #fff; letter-spacing: 4px; text-transform: uppercase; box-shadow: 0 5px 25px rgba(168, 85, 247, 0.3); 
        }

        /* GRID & CARDS */
        .grid-days { display: flex; gap: 22px; flex: 1; position: relative; z-index: 10; }
        .day-col { flex: 1; display: flex; flex-direction: column; }
        .day-header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 5px 8px; border-bottom: 3px solid rgba(168, 85, 247, 0.4); margin-bottom: 16px; position: relative; }
        .day-header::after { content: ''; position: absolute; bottom: -3px; left: 0; width: 40%; height: 3px; background: #22d3ee; box-shadow: 0 0 15px #22d3ee; }
        .day-name { font-family: 'Oswald', sans-serif; font-style: italic; font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 2px; text-shadow: 2px 2px 0 rgba(168,85,247,0.5); }
        .day-date { font-family: 'Oswald', sans-serif; font-style: italic; font-size: 38px; font-weight: 700; color: #22d3ee; line-height: 0.8; text-shadow: 0 0 15px rgba(34, 211, 238, 0.5); }
        .day-card { flex: 1; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: rgba(6, 2, 12, 0.95); border: 1px solid rgba(34, 211, 238, 0.2); border-top: 4px solid #22d3ee; box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(34, 211, 238, 0.05); }

        .event-block { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px 20px; overflow: hidden; }
        .event-block:not(:last-child)::after { content: ''; position: absolute; bottom: 0; left: 5%; right: 5%; height: 2px; background: linear-gradient(to right, transparent, #22d3ee, transparent); z-index: 10; box-shadow: 0 0 15px #22d3ee; }
        .event-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center top; background-repeat: no-repeat; z-index: 1; }
        .event-bg.with-effects { filter: saturate(1.3) brightness(0.7) contrast(1.1); transform: scale(1.05); }
        .event-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(6, 2, 12, 0.9) 0%, transparent 35%); z-index: 2; }
        .event-overlay.with-effects { background: linear-gradient(to top, #06020c 10%, rgba(6, 2, 12, 0.5) 65%, transparent 100%); }

        .event-info { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 5px; }
        
        .time-wrapper { align-self: flex-start; background-color: #7e22ce; background: linear-gradient(to right, #9d00ff, #6b21a8); padding: 6px 16px; margin-bottom: 8px; border-left: 4px solid #e9d5ff; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .time-wrapper.cyan { background-color: #0891b2; background: linear-gradient(to right, #22d3ee, #0e7490); border-left-color: #cffafe; }
        .time-text { display: block; font-family: 'Oswald', sans-serif; font-style: italic; font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 1px; }
        
        .game-title { font-family: 'Oswald', sans-serif; font-style: italic; font-size: 32px; font-weight: 700; color: #fff; text-transform: uppercase; line-height: 1; text-shadow: 0 5px 15px rgba(0,0,0,0.9); letter-spacing: 1px; }
        .game-sub { font-size: 16px; font-weight: 700; color: #e9d5ff; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
        .time-wrapper.cyan + .game-title + .game-sub { color: #a5f3fc; }

        .text-center { text-align: center; align-items: center; justify-content: center; height: 100%; }
        .text-center .game-title { font-size: 48px; color: #fff; text-shadow: 0 5px 25px rgba(168, 85, 247, 0.9); }

        /* DAY OFF */
        .day-col.off { opacity: 0.85; }
        .day-col.off .day-header { border-bottom-color: #4b5563; }
        .day-col.off .day-header::after { background: #9ca3af; box-shadow: none; }
        .day-col.off .day-name, .day-col.off .day-date { color: #9ca3af; text-shadow: none; }
        .day-col.off .day-card { border-color: rgba(168, 85, 247, 0.15); border-top-color: #4b5563; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .event-block.off-block .event-overlay { background: repeating-linear-gradient(45deg, rgba(20, 15, 30, 0.8), rgba(20, 15, 30, 0.8) 15px, rgba(5, 2, 10, 0.9) 15px, rgba(5, 2, 10, 0.9) 30px); }
        .text-center.off-text .game-title { color: #9ca3af; text-shadow: 0 2px 5px rgba(0,0,0,0.5); letter-spacing: 5px; }

        /* BADGE TWITCH Centré */
        .twitch-badge { 
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); 
            background-color: #06020c; border: 2px solid rgba(34, 211, 238, 0.4); border-right: 8px solid #22d3ee; 
            border-radius: 8px; padding: 10px 35px 10px 30px; display: flex; align-items: center; gap: 15px; z-index: 20; 
            box-shadow: 0 10px 30px rgba(34, 211, 238, 0.2); 
        }
        .twitch-icon svg { width: 28px; height: 28px; fill: #fff; display: block; }
        .twitch-text { font-family: 'Oswald', sans-serif; font-style: italic; font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 2px; padding-top: 3px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        /* Gestion de l'affichage adaptatif de base */
        @media (max-width: 1600px) { .poster { transform: scale(0.55); } }
        @media (max-width: 1300px) { .poster { transform: scale(0.45); } }
        
        /* Classe spéciale déclenchée par le bouton pour forcer la taille 100% (pour F12) */
        .poster.ready-for-capture {
            transform: scale(1) !important;
            margin: auto;
        }
    </style>
</head>
<body>

    <!-- ═══ SIDEBAR GÉNÉRÉE PAR JAVASCRIPT ═══ -->
    <aside class="sidebar">
        <h2>🛠️ Globaux</h2>
        <div class="form-group">
            <label>Nom en haut à gauche</label>
            <input type="text" value="SQUADIR" oninput="updateGlobal('name', this.value)">
        </div>
        <div class="form-group">
            <label>Pseudo Twitch</label>
            <input type="text" value="SQUADIRFN" oninput="updateGlobal('twitch', this.value)">
        </div>
        <div class="form-group">
            <label>Mois / Année</label>
            <input type="text" value="JUILLET 2026" oninput="updateGlobal('date', this.value)">
        </div>

        <div id="sidebar-days-container"></div> 

        <button class="f12-btn" id="f12-btn" onclick="toggleCaptureMode()">📸 Préparer pour Capture</button>
        <div class="f12-help">
            1. Clique ici pour afficher en 1920x1080<br>
            2. Fais <b>F12</b> (Inspecter)<br>
            3. Clic droit sur le code de l'affiche<br>
            4. <b>Capturer le nœud</b>
        </div>
    </aside>

    <!-- ═══ AFFICHE GÉNÉRÉE PAR JAVASCRIPT ═══ -->
    <main class="preview-area" id="preview-area">
        <!-- C'est ce bloc qu'il faut cibler dans F12 -->
        <div class="poster" id="poster-capture">
            
            <div class="bg-layer">
                <div class="beam-1"></div><div class="beam-2"></div>
                <div class="watermark" id="display-watermark">SQUADIR</div>
                <div class="dot-matrix"></div>
            </div>

            <header class="header">
                <div class="title-group">
                    <div class="title-planning">PLANNING</div>
                    <div class="title-name" id="display-name">SQUADIR</div>
                </div>
                <div class="header-badge" id="display-date">JUILLET 2026</div>
            </header>

            <div class="grid-days" id="poster-grid-container"></div> 

            <div class="twitch-badge">
                <div class="twitch-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4.265 3 3 6.236v13.223h5.154V23l3.417-3.541h3.795L21 13.626V3H4.265zm15.044 9.68-2.656 2.76H12.1l-2.656 2.75v-2.75H5.53V4.69h13.78v7.99z"/>
                        <path d="M11.344 7.45h2.276v4.83h-2.276zM15.14 7.45h2.275v4.83H15.14z"/>
                    </svg>
                </div>
                <span class="twitch-text" id="display-twitch">TWITCH.TV/SQUADIRFN</span>
            </div>

        </div>
    </main>

    <!-- ═══ MOTEUR JAVASCRIPT ═══ -->
    <script>
        const placeholderImg = "data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="; 
        
        let schedule = [
            // Ajout de l'heure pour le stream libre (time1)
            { id: 0, name: 'LUNDI', date: '20', type: 'libre', img1: 'stream.png', time1: '18H00', title1: 'STREAM<br>LIBRE' },
            { id: 1, name: 'MARDI', date: '21', type: 'split', img1: 'ranked.png', time1: '19H00', title1: 'FORTNITE', sub1: 'RANKED RELOAD', img2: 'f1.jpg', time2: '21H00', title2: 'F1 25', sub2: 'VIEWERS' },
            { id: 2, name: 'MERCREDI', date: '22', type: 'off' },
            { id: 3, name: 'JEUDI', date: '23', type: 'single', img1: 'perf.png', time1: '19H00', title1: 'FORTNITE', sub1: 'PERFORMANCE CUP' },
            { id: 4, name: 'VENDREDI', date: '24', type: 'single', img1: 'perf.png', time1: '19H00', title1: 'FORTNITE', sub1: 'PERFORMANCE CUP' },
            { id: 5, name: 'SAMEDI', date: '25', type: 'single', img1: 'bombe.png', time1: '15H00', title1: 'BOMBANANA!', sub1: 'AVEC KASH & WALID' },
            { id: 6, name: 'DIMANCHE', date: '26', type: 'split', img1: 'ranked.png', time1: '14H00', title1: 'FORTNITE', sub1: 'RANKED SOLO', img2: 'pillars.jpg', time2: '23H00', title2: 'PILLARS', sub2: 'GAMES VIEWERS' }
        ];

        function updateData(dayId, field, value) {
            schedule[dayId][field] = value;
            renderGrid(); 
        }

        function updateType(dayId, newType) {
            schedule[dayId].type = newType;
            if(!schedule[dayId].title1) schedule[dayId].title1 = "TITRE";
            if(!schedule[dayId].sub1) schedule[dayId].sub1 = "SOUS-TITRE";
            if(!schedule[dayId].time1) schedule[dayId].time1 = "20H00";
            if(newType === 'split' && !schedule[dayId].title2) {
                schedule[dayId].title2 = "JEU 2"; schedule[dayId].sub2 = "INFO"; schedule[dayId].time2 = "22H00";
            }
            renderSidebar(); 
            renderGrid();    
        }

        function handleImageUpload(input, dayId, imageField) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    schedule[dayId][imageField] = e.target.result; 
                    renderGrid(); 
                }
                reader.readAsDataURL(file);
            }
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-days-container');
            container.innerHTML = ''; 

            schedule.forEach((day, index) => {
                let html = `
                <details>
                    <summary>📅 ${day.name}</summary>
                    <div class="details-content">
                        <div class="form-group">
                            <label>Format de la journée</label>
                            <select onchange="updateType(${index}, this.value)">
                                <option value="single" ${day.type === 'single' ? 'selected' : ''}>Jeu Unique</option>
                                <option value="split" ${day.type === 'split' ? 'selected' : ''}>Split (2 Jeux)</option>
                                <option value="libre" ${day.type === 'libre' ? 'selected' : ''}>Stream Libre</option>
                                <option value="off" ${day.type === 'off' ? 'selected' : ''}>Day Off</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date (Numéro)</label>
                            <input type="text" value="${day.date || ''}" oninput="updateData(${index}, 'date', this.value)">
                        </div>`;

                if (day.type === 'single') {
                    html += `
                        <div class="form-group"><label>Heure</label><input type="text" value="${day.time1 || ''}" oninput="updateData(${index}, 'time1', this.value)"></div>
                        <div class="form-group"><label>Titre (Jeu)</label><input type="text" value="${day.title1 || ''}" oninput="updateData(${index}, 'title1', this.value)"></div>
                        <div class="form-group"><label>Sous-titre</label><input type="text" value="${day.sub1 || ''}" oninput="updateData(${index}, 'sub1', this.value)"></div>
                        <div class="form-group">
                            <label>Image de fond</label>
                            <label class="upload-btn">📁 Uploader une image<input type="file" accept="image/*" onchange="handleImageUpload(this, ${index}, 'img1')"></label>
                        </div>`;
                } else if (day.type === 'split') {
                    html += `
                        <div class="split-divider"></div><label style="color:#22d3ee;">▶ JEU 1 (HAUT)</label>
                        <div class="form-group"><label>Heure</label><input type="text" value="${day.time1 || ''}" oninput="updateData(${index}, 'time1', this.value)"></div>
                        <div class="form-group"><label>Titre</label><input type="text" value="${day.title1 || ''}" oninput="updateData(${index}, 'title1', this.value)"></div>
                        <div class="form-group"><label>Sous-titre</label><input type="text" value="${day.sub1 || ''}" oninput="updateData(${index}, 'sub1', this.value)"></div>
                        <div class="form-group">
                            <label class="upload-btn">📁 Uploader Image 1<input type="file" accept="image/*" onchange="handleImageUpload(this, ${index}, 'img1')"></label>
                        </div>
                        
                        <div class="split-divider"></div><label style="color:#a855f7;">▶ JEU 2 (BAS)</label>
                        <div class="form-group"><label>Heure</label><input type="text" value="${day.time2 || ''}" oninput="updateData(${index}, 'time2', this.value)"></div>
                        <div class="form-group"><label>Titre</label><input type="text" value="${day.title2 || ''}" oninput="updateData(${index}, 'title2', this.value)"></div>
                        <div class="form-group"><label>Sous-titre</label><input type="text" value="${day.sub2 || ''}" oninput="updateData(${index}, 'sub2', this.value)"></div>
                        <div class="form-group">
                            <label class="upload-btn">📁 Uploader Image 2<input type="file" accept="image/*" onchange="handleImageUpload(this, ${index}, 'img2')"></label>
                        </div>`;
                } else if (day.type === 'libre') {
                    html += `
                        <div class="form-group"><label>Heure</label><input type="text" value="${day.time1 || ''}" oninput="updateData(${index}, 'time1', this.value)"></div>
                        <div class="form-group"><label>Gros Titre (&lt;br&gt; = saut ligne)</label><input type="text" value="${day.title1 || ''}" oninput="updateData(${index}, 'title1', this.value)"></div>
                        <div class="form-group">
                            <label>Image de fond (Effet Sombre)</label>
                            <label class="upload-btn">📁 Uploader une image<input type="file" accept="image/*" onchange="handleImageUpload(this, ${index}, 'img1')"></label>
                        </div>`;
                }

                html += `</div></details>`;
                container.innerHTML += html;
            });
        }

        function renderGrid() {
            const grid = document.getElementById('poster-grid-container');
            grid.innerHTML = '';

            schedule.forEach(day => {
                let cardHTML = `<div class="day-col ${day.type === 'off' ? 'off' : ''}">
                    <div class="day-header"><span class="day-name">${day.name}</span><span class="day-date">${day.date}</span></div>
                    <div class="day-card">`;

                if (day.type === 'off') {
                    cardHTML += `<div class="event-block off-block"><div class="event-overlay"></div><div class="event-info text-center off-text"><span class="game-title">DAY<br>OFF</span></div></div>`;
                } 
                else if (day.type === 'libre') {
                    cardHTML += `
                        <div class="event-block">
                            <div class="event-bg with-effects" style="background-image: url('${day.img1 || placeholderImg}')"></div>
                            <div class="event-overlay with-effects"></div>
                            <div class="event-info text-center">
                                <div class="time-wrapper" style="align-self: center; margin-bottom: 12px;"><span class="time-text">${day.time1 || ''}</span></div>
                                <span class="game-title">${day.title1 || ''}</span>
                            </div>
                        </div>`;
                }
                else if (day.type === 'single') {
                    cardHTML += `
                        <div class="event-block">
                            <div class="event-bg" style="background-image: url('${day.img1 || placeholderImg}')"></div>
                            <div class="event-overlay"></div>
                            <div class="event-info">
                                <div class="time-wrapper"><span class="time-text">${day.time1 || ''}</span></div>
                                <span class="game-title">${day.title1 || ''}</span>
                                <span class="game-sub">${day.sub1 || ''}</span>
                            </div>
                        </div>`;
                }
                else if (day.type === 'split') {
                    cardHTML += `
                        <div class="event-block">
                            <div class="event-bg" style="background-image: url('${day.img1 || placeholderImg}')"></div>
                            <div class="event-overlay"></div>
                            <div class="event-info">
                                <div class="time-wrapper"><span class="time-text">${day.time1 || ''}</span></div>
                                <span class="game-title">${day.title1 || ''}</span>
                                <span class="game-sub">${day.sub1 || ''}</span>
                            </div>
                        </div>
                        <div class="event-block">
                            <div class="event-bg" style="background-image: url('${day.img2 || placeholderImg}')"></div>
                            <div class="event-overlay"></div>
                            <div class="event-info">
                                <div class="time-wrapper cyan"><span class="time-text" style="color:#000;">${day.time2 || ''}</span></div>
                                <span class="game-title">${day.title2 || ''}</span>
                                <span class="game-sub">${day.sub2 || ''}</span>
                            </div>
                        </div>`;
                }

                cardHTML += `</div></div>`;
                grid.innerHTML += cardHTML;
            });
        }

        function updateGlobal(target, value) {
            if(target === 'name') {
                document.getElementById('display-name').innerText = value;
                document.getElementById('display-watermark').innerText = value;
            } else if (target === 'twitch') {
                document.getElementById('display-twitch').innerText = "TWITCH.TV/" + value;
            } else if (target === 'date') {
                document.getElementById('display-date').innerText = value;
            }
        }

        // Fonction pour activer/désactiver la vue 100% (pour faciliter F12)
        let isCaptureMode = false;
        function toggleCaptureMode() {
            const poster = document.getElementById('poster-capture');
            const btn = document.getElementById('f12-btn');
            
            isCaptureMode = !isCaptureMode;
            
            if(isCaptureMode) {
                poster.classList.add('ready-for-capture');
                btn.innerText = "❌ Annuler le zoom";
                btn.style.background = "linear-gradient(to right, #4b5563, #374151)";
                // Fait scroller la zone pour voir le poster
                document.getElementById('preview-area').scrollTop = 0;
            } else {
                poster.classList.remove('ready-for-capture');
                btn.innerText = "📸 Préparer pour Capture";
                btn.style.background = "linear-gradient(to right, #e11d48, #be123c)";
            }
        }

        renderSidebar();
        renderGrid();
    </script>
</body>
</html>
